name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run compile-tests && pnpm run compile && xvfb-run -a pnpm exec vscode-test
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          ELECTRON_NO_SANDBOX: '1'
          VSCODE_TEST_ELECTRON_ARGS: '--no-sandbox --disable-setuid-sandbox'

      - name: Dashboard UI test
        run: pnpm run test:dashboard-ui
        env:
          DASHBOARD_UI_NO_SANDBOX: '1'
