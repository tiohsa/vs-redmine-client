services:
  redmine:
    image: redmine:6
    ports:
      - "127.0.0.1:${REDMINE_PORT:-3000}:3000"
    volumes:
      - redmine_sqlite:/usr/src/redmine/sqlite
      - redmine_files:/usr/src/redmine/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  redmine_sqlite:
  redmine_files:
