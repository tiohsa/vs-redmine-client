<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redmine Client アーキテクチャ概要</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:rgba(45,49,66,.12); --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --link:#2e5aa8; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif; }
    main { width:min(1360px,100%); margin:0 auto; padding:32px 40px 24px; }
    .eyebrow { margin:0 0 8px; color:var(--soft); font:500 8px/1.4 'Geist Mono','Noto Sans Mono CJK JP',monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font:400 28px/1.1 'Instrument Serif','Yu Mincho',serif; }
    .subtitle { margin:8px 0 24px; color:var(--muted); font-size:12px; }
    figure { margin:0; overflow-x:auto; }
    svg { display:block; width:100%; min-width:960px; height:auto; }
    footer { margin-top:16px; padding-top:12px; border-top:1px solid var(--rule); color:var(--soft); font:400 8px/1.5 'Geist Mono','Noto Sans Mono CJK JP',monospace; letter-spacing:.06em; }
  </style>
</head>
<body>

  <p class="eyebrow">SYSTEM ARCHITECTURE · 2026-08-13</p>
